name: P0 Neon Fist upstream verification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p0-neon-fist.yml'

permissions: {}

jobs:
  upstream-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UPSTREAM_SHA: c28ffb7e7e81ed8f9cec274772c43c30d2876d42
      CI: 'true'
    steps:
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone pinned public source (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-tags https://github.com/developerrutu/neon-fist.git upstream
          cd upstream
          git checkout --detach "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
          node --version
          npm --version
      - name: Verify repository license and package scripts
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE && grep -q 'MIT License' LICENSE
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (p.scripts?.test !== 'node tests/run.js') process.exit(2); console.log('license metadata:', p.license, '; scripts:', p.scripts)"
          echo "The upstream MIT LICENSE and package.json ISC field do not match; manual rights review remains required." >> "$GITHUB_STEP_SUMMARY"
      - name: Install exact locked dependencies without lifecycle scripts
        working-directory: upstream
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run original upstream tests
        working-directory: upstream
        run: npm test
      - name: Syntax-check game and server entrypoints
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          node --check src/server/index.js
          node --check src/server/signaling.js
          node --check src/server/liveopsRoutes.js
          node --check tests/run.js
      - name: Verify unauthenticated admin control is blocked before production
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export PORT=18787
          node src/server/index.js > "$RUNNER_TEMP/neon-local.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18787/health >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" != 1 ]; then
            echo "Local server failed to start"
            tail -40 "$RUNNER_TEMP/neon-local.log"
            exit 1
          fi
          # Deliberately exercise an unsafe endpoint ONLY on this isolated local CI runner.
          http_code=$(curl --silent --show-error --max-time 4 -o "$RUNNER_TEMP/admin-response.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:18787/api/admin/config/kill \
            -H 'Content-Type: application/json' \
            -d '{"channel":"stable","killed":true}')
          echo "Unauthenticated local POST /api/admin/config/kill HTTP status: $http_code"
          if [ "$http_code" = 200 ]; then
            echo "SECURITY BLOCKER CONFIRMED: unauthenticated caller was able to kill stable channel on a local clone." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The endpoint returned $http_code; inspect response and implementation before drawing security conclusions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Report strict scope
        if: always()
        shell: bash
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This run covers original upstream Node tests and syntax only." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT tested: mobile browsers, actual PC-to-phone P2P sessions, user input responsiveness, security of admin APIs, rights to commercial use of all assets, or Chinese online game licensing." >> "$GITHUB_STEP_SUMMARY"
