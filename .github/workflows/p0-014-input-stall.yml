name: P0-014 GGRS input-stall diagnosis via reused WASM artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p0-014-input-stall.yml'
      - 'lab/matchbox_input_stall_diagnostic.mjs'

permissions:
  contents: read
  actions: read

jobs:
  stall-diagnostic:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repetition: [1,3,5]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GGRS_EXTRA_SEND_DELAY_MS: '90'
      GGRS_JITTER_MAX_MS: '20'
      GGRS_DROP_FIRST_BURST: '5'
      GGRS_REPETITION: ${{ matrix.repetition }}
    steps:
      - name: Check out only current test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse immutable binary from P0-013D build; do not recompile Rust/Bevy
        uses: actions/download-artifact@v4
        with:
          name: p0-013d-nonzero-ggrs-bundle
          run-id: 40689108165
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-bundle
      - name: Verify every source binary against archived SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (cd ci-bundle && sha256sum -c SHA256SUMS)
          chmod +x ci-bundle/bin/matchbox_server
          echo 'Reused the exact compiled WASM originally produced in #40689108165.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness, syntax-check before launching
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix lab --ignore-scripts --no-audit --no-fund
          node --check lab/matchbox_input_stall_diagnostic.mjs
          google-chrome --version
      - name: Actually measure nonzero capture-to-application time and stalled game frames
        shell: bash
        run: |
          set -euo pipefail
          ci-bundle/bin/matchbox_server > "$RUNNER_TEMP/stall-signal.log" 2>&1 &
          SIGNAL_PID=$!
          python3 -m http.server 1334 --bind 127.0.0.1 --directory ci-bundle/dist > "$RUNNER_TEMP/stall-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$SIGNAL_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 1 http://127.0.0.1:1334/ >/dev/null &&
               curl -fsS --max-time 1 http://127.0.0.1:3536/health >/dev/null; then
              ok=1; break
            fi
            sleep 0.35
          done
          test "$ok" -eq 1
          node lab/matchbox_input_stall_diagnostic.mjs
      - name: Interpret outcome
        if: always()
        shell: bash
        run: |
          echo 'Diagnostic only. Local nonzero key is held until GGRS actually applies it, capped by a strict 1.8s timeout per player.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If the timer expires or frame-stall data appears, that is a product-experience failure, not a permission to skip the input verification gate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Same host Chrome/Rust/WASM simulation, 90ms +/-20ms injected send delay plus 5 packet drops after nonzero input. Not real telecom/Android/iOS.' >> "$GITHUB_STEP_SUMMARY"
