name: P0-014E no-fault short tap baseline

on:
  push:
    paths:
      - '.github/workflows/p0-014e-short-tap-no-loss.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  short-tap:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prediction_window: [12,16,20]
        repetition: [1,3,5]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GGRS_EXTRA_SEND_DELAY_MS: '0'
      GGRS_JITTER_MAX_MS: '0'
      GGRS_DROP_FIRST_BURST: '0'
      GGRS_REPETITION: ${{ matrix.repetition }}
      GGRS_PREDICTION_WINDOW: ${{ matrix.prediction_window }}
      GGRS_LATENCY_BUDGET_MS: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse same immutable WASM from completed P0-014A (even if quality gate failed)
        uses: actions/download-artifact@v4
        with:
          name: p0-014a-window-comparison-bundle
          run-id: 40693239358
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-bundle
      - name: Strict SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          (cd ci-bundle && sha256sum -c SHA256SUMS)
          chmod +x ci-bundle/bin/matchbox_server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser harness setup
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix lab --ignore-scripts --no-audit --no-fund
          node --check lab/matchbox_short_tap_no_loss.mjs
          google-chrome --version
      - name: Test real 120ms key taps on the same GGRS browser without synthetic loss/latency
        shell: bash
        run: |
          set -euo pipefail
          ci-bundle/bin/matchbox_server > "$RUNNER_TEMP/baseline-signaling.log" 2>&1 &
          SIGNAL_PID=$!
          python3 -m http.server 1334 --bind 127.0.0.1 --directory ci-bundle/dist > "$RUNNER_TEMP/baseline-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$SIGNAL_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 75); do
            if curl -fsS --max-time 1 http://127.0.0.1:1334/ >/dev/null &&
               curl -fsS --max-time 1 http://127.0.0.1:3536/health >/dev/null; then
              ok=1; break
            fi
            sleep 0.35
          done
          test "$ok" -eq 1
          node lab/matchbox_short_tap_no_loss.mjs
      - name: Scope and quality interpretation
        if: always()
        shell: bash
        run: |
          echo "Prediction window ${{ matrix.prediction_window }}, seed ${{ matrix.repetition }}; real 120ms physical tap, 0ms extra send delay and 0 artificial dropped frames; same fixed WASM used by P0-014C." >> "$GITHUB_STEP_SUMMARY"
          echo "With no artificial network fault, a missed 120ms tap or >250ms local capture-to-apply is still a FAIL. Compare this control with P0-014C to isolate browser/headless sampling from network timing." >> "$GITHUB_STEP_SUMMARY"
