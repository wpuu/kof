<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P0-012 Official Matchbox GGRS Browser Game Lab</title>
<style>
html,body{margin:0;background:#1b1b22;color:#ddd;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;max-width:100vw;max-height:100vh;margin:auto;outline:none}
#status{position:fixed;top:0;left:0;padding:6px 9px;background:#111a;z-index:10;font-size:12px}
</style>
</head>
<body>
<div id="status">Starting original Matchbox Bevy/GGRS example…</div>
<script type="module">
import init from './game.js';
window.__kofTestBootStatus='loading';
try {
  await init();
  window.__kofTestBootStatus='initialized';
  document.getElementById('status').textContent='WASM initialized (room connection checked separately)';
} catch (error) {
  window.__kofTestBootStatus='error:'+String(error?.name || 'startup');
  document.getElementById('status').textContent='WASM boot failure';
  console.error('WASM boot failure',error);
}
</script>
</body></html>
