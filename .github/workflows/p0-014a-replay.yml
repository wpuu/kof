name: P0-014A replay nine prediction window samples without rebuild

on:
  push:
    paths:
      - '.github/workflows/p0-014a-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prediction_window: [12,16,20]
        repetition: [1,3,5]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GGRS_EXTRA_SEND_DELAY_MS: '90'
      GGRS_JITTER_MAX_MS: '20'
      GGRS_DROP_FIRST_BURST: '5'
      GGRS_REPETITION: ${{ matrix.repetition }}
      GGRS_PREDICTION_WINDOW: ${{ matrix.prediction_window }}
      GGRS_LATENCY_BUDGET_MS: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse same immutable WASM from completed P0-014A (even if quality gate failed)
        uses: actions/download-artifact@v4
        with:
          name: p0-014a-window-comparison-bundle
          run-id: 40693239358
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-bundle
      - name: Strict SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          (cd ci-bundle && sha256sum -c SHA256SUMS)
          chmod +x ci-bundle/bin/matchbox_server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser harness setup
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix lab --ignore-scripts --no-audit --no-fund
          node --check lab/matchbox_prediction_window_comparison.mjs
          google-chrome --version
      - name: Replay P0-014A predicted window trial on identical prebuilt WASM
        shell: bash
        run: |
          set -euo pipefail
          ci-bundle/bin/matchbox_server > "$RUNNER_TEMP/baseline-signaling.log" 2>&1 &
          SIGNAL_PID=$!
          python3 -m http.server 1334 --bind 127.0.0.1 --directory ci-bundle/dist > "$RUNNER_TEMP/baseline-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$SIGNAL_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 75); do
            if curl -fsS --max-time 1 http://127.0.0.1:1334/ >/dev/null &&
               curl -fsS --max-time 1 http://127.0.0.1:3536/health >/dev/null; then
              ok=1; break
            fi
            sleep 0.35
          done
          test "$ok" -eq 1
          node lab/matchbox_prediction_window_comparison.mjs
      - name: Scope and quality interpretation
        if: always()
        shell: bash
        run: |
          echo "Prediction window ${{ matrix.prediction_window }}, seed ${{ matrix.repetition }}; replay after fixed artifact download. 90ms +/-20ms artificial send delay and 5 dropped after nonzero capture." >> "$GITHUB_STEP_SUMMARY"
          echo "A green outcome requires both simulated players moved, same-frame state matches, and local input capture-to-apply <=250ms. Report slow conditions as red, do not mislabel network stalls as successful quality." >> "$GITHUB_STEP_SUMMARY"
