name: P0-014F DOM 120ms taps versus Rust GGRS input event-loop diagnosis

on:
  push:
    paths:
      - '.github/workflows/p0-014f-dom-tap-probe.yml'
      - 'lab/matchbox_short_tap_dom_diagnostic.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  short-tap:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - prediction_window: 12
            repetition: 1
            extra_send_delay: 0
            lost: 0
          - prediction_window: 12
            repetition: 3
            extra_send_delay: 0
            lost: 0
          - prediction_window: 12
            repetition: 1
            extra_send_delay: 90
            lost: 5
          - prediction_window: 12
            repetition: 3
            extra_send_delay: 90
            lost: 5
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GGRS_EXTRA_SEND_DELAY_MS: ${{ matrix.extra_send_delay }}
      GGRS_JITTER_MAX_MS: '20'
      GGRS_DROP_FIRST_BURST: ${{ matrix.lost }}
      GGRS_REPETITION: ${{ matrix.repetition }}
      GGRS_PREDICTION_WINDOW: ${{ matrix.prediction_window }}
      GGRS_LATENCY_BUDGET_MS: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse same immutable WASM from completed P0-014A (even if quality gate failed)
        uses: actions/download-artifact@v4
        with:
          name: p0-014a-window-comparison-bundle
          run-id: 40693239358
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-bundle
      - name: Strict SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          (cd ci-bundle && sha256sum -c SHA256SUMS)
          chmod +x ci-bundle/bin/matchbox_server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser harness setup
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix lab --ignore-scripts --no-audit --no-fund
          node --check lab/matchbox_short_tap_dom_diagnostic.mjs
          google-chrome --version
      - name: Record actual DOM keyboard delivery and browser event-loop gaps versus GGRS input
        shell: bash
        run: |
          set -euo pipefail
          ci-bundle/bin/matchbox_server > "$RUNNER_TEMP/baseline-signaling.log" 2>&1 &
          SIGNAL_PID=$!
          python3 -m http.server 1334 --bind 127.0.0.1 --directory ci-bundle/dist > "$RUNNER_TEMP/baseline-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$SIGNAL_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 75); do
            if curl -fsS --max-time 1 http://127.0.0.1:1334/ >/dev/null &&
               curl -fsS --max-time 1 http://127.0.0.1:3536/health >/dev/null; then
              ok=1; break
            fi
            sleep 0.35
          done
          test "$ok" -eq 1
          node lab/matchbox_short_tap_dom_diagnostic.mjs
      - name: Scope and quality interpretation
        if: always()
        shell: bash
        run: |
          echo "Prediction window 12, seed ${{ matrix.repetition }}; 120ms key down/up, 0 or 90ms artificial delay and ${{ matrix.lost }} dropped fast sends. Diagnose DOM focus, exact RAF/timer callback counts DURING each physical tap and timestamp-aligned event-loop gaps, versus Rust nonzero sampling." >> "$GITHUB_STEP_SUMMARY"
          echo "Any missed key remains a FAIL. Preserve DOM keydown/keyup and event-loop-gap diagnostics to distinguish Chrome headless scheduling from GGRS input overwrite. Do not claim true phone hardware compatibility." >> "$GITHUB_STEP_SUMMARY"
